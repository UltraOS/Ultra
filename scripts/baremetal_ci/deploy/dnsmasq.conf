# Proxy-DHCP + TFTP for the baremetal CI: listens on the subnet
# the deploy fills in from the server config (pxe_subnet) without
# handing out addresses, only answers PXE clients with a boot file,
# and serves the TFTP root the CI server installs kernels into.

port=0

log-dhcp

enable-tftp
tftp-root=/srv/ultra-ci/tftp

# A client whose MAC names a directory under the root (lowercase,
# dashes, made by the CI server) is served from there instead, that
# is how every machine gets its own loader config
tftp-unique-root=mac

dhcp-range=@PXE_SUBNET@,proxy

pxe-service=BC_EFI, "Boot Ultra", BOOTX64.EFI
pxe-service=X86-64_EFI, "Boot Ultra", BOOTX64.EFI
pxe-service=x86PC, "Boot Legacy", hyper.pxe
