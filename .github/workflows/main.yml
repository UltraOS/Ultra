name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-python-scripts:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install flake8 & mypy
        run: |
          sudo apt update
          sudo apt install python3 python3-pip
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip install flake8 mypy pyelftools

      - name: Run flake8 on the project
        run: flake8 *.py scripts/*.py scripts/baremetal_ci/*.py

      - name: Run mypy on the project
        run: |
          mypy *.py
          mypy scripts/

  lint-kernel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Build the platform toolchain
        run: "${{ github.workspace }}/build.py --toolchain clang --toolchain-only"

      - name: Check the coding conventions
        run: "${{ github.workspace }}/build.py --toolchain clang --lint"

  toolchain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Build the GCC toolchain unless it is cached
        uses: ./.github/actions/toolchain
        with:
          arch: x86_64
          toolchain: gcc
          lookup-only: true

  build:
    needs: toolchain
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [x86_64]
        toolchain: [gcc, clang]
        preset: [debug-lite, release]
        exclude:
          # FIXME: the GCC build somehow ends up being corrupted with
          #        libexec/cc1 containing garbage data.
          - os: macos-latest
            toolchain: gcc

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Build the platform toolchain
        uses: ./.github/actions/toolchain
        with:
          arch: ${{ matrix.arch }}
          toolchain: ${{ matrix.toolchain }}

      - name: Build the kernel
        run: "${{ github.workspace }}/build.py --arch ${{ matrix.arch }} --config ${{ matrix.preset }} --toolchain ${{ matrix.toolchain }} --no-tune-native"

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Run the userspace unit tests
        run: "${{ github.workspace }}/build.py --unit-tests"
