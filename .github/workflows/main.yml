name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-python-scripts:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install flake8 & mypy
        run: |
          sudo apt update
          sudo apt install python3 python3-pip
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip install flake8 mypy pyelftools

      - name: Run flake8 on the project
        run: flake8 *.py scripts/*.py

      - name: Run mypy on the project
        run: |
          mypy *.py
          mypy scripts/

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [x86_64]
        toolchain: [gcc, clang]
        exclude:
          # FIXME: the GCC build somehow ends up being corrupted with
          #        libexec/cc1 containing garbage data.
          - os: macos-latest
            toolchain: gcc

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - if: ${{ matrix.toolchain == 'gcc' }}
        id: toolchain-cache
        name: Restore the toolchain cache
        uses: actions/cache/restore@v4.2.2
        env:
          gcc-version: 15.1.0
        with:
          path: "${{ github.workspace }}/toolchain/tools-${{ matrix.toolchain }}-${{ matrix.arch }}"
          key: "${{ runner.os }}-${{ runner.arch }}-${{ matrix.arch }}-gcc-${{ env.gcc-version }}"

      - name: Build the platform toolchain
        run: "${{ github.workspace }}/build.py --config ${{ github.workspace }}/.github/configs/${{ matrix.arch }}-ci.config --toolchain ${{ matrix.toolchain }} --no-tune-native --toolchain-only"

      - if: ${{ matrix.toolchain == 'gcc' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        name: Save the toolchain cache
        uses: actions/cache/save@v4.2.2
        with:
          path: "${{ github.workspace }}/toolchain/tools-${{ matrix.toolchain }}-${{ matrix.arch }}"
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Build the kernel
        run: "${{ github.workspace }}/build.py --config ${{ github.workspace }}/.github/configs/${{ matrix.arch }}-ci.config --toolchain ${{ matrix.toolchain }} --no-tune-native"

      - name: Run the userspace unit tests
        run: "${{ github.workspace }}/build.py --unit-tests"
